name: Android CI Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11' # Compatible with Android projects targeting Java 1.8
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle (includes lint, runs unit tests specified in build types)
      run: ./gradlew build # 'build' task typically depends on test tasks for debug/release build types.

    # Explicitly run unit tests (often redundant if 'build' includes them, but good for clarity)
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Run UI Tests (Placeholder)
      run: echo "UI Test step placeholder. Implement actual UI tests and emulator setup later."
      # Example for future: ./gradlew connectedDebugAndroidTest

    - name: Assemble Debug APK
      id: assemble_apk # Give an id to the step to check its conclusion
      # Only build APK for pushes/merges to main or manual dispatch
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      run: ./gradlew assembleDebug

    - name: Upload Debug APK Artifact (for pushes to main and manual runs)
      # Upload only if APK was assembled successfully
      if: steps.assemble_apk.conclusion == 'success'
      uses: actions/upload-artifact@v3
      with:
        name: app-debug # Name of the artifact bundle
        path: app/build/outputs/apk/debug/app-debug.apk # Path to the actual file

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only run on direct push to main or manual trigger, and if build-and-test job was successful
    if: success() && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Checkout code # Needed for commit SHA
      uses: actions/checkout@v3

    - name: Download Debug APK from build job
      uses: actions/download-artifact@v3
      with:
        name: app-debug # Name of the artifact bundle specified in upload-artifact
        # This will download app-debug.apk to the current working directory.

    - name: Verify downloaded APK
      run: ls -l app-debug.apk # Confirms the file is there

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release-commit-${{ github.sha }}
        release_name: Release for commit ${{ github.sha }}
        body: |
          Automated pre-release for commit ${{ github.sha }}.
          Includes debug APK for testing purposes.
        draft: false
        prerelease: true # Marking as pre-release as it's a debug build

    - name: Upload Release Asset (Debug APK)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./app-debug.apk # Path to the downloaded APK file
        asset_name: app-debug-${{ github.sha }}.apk
        asset_content_type: application/vnd.android.package-archive
